name: Mobile EAS Build

on:
  push:
    branches: [main]
    paths:
      - 'apps/buyer-mobile/**'
      - 'apps/supplier-mobile/**'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'all'
        type: choice
        options: ['ios', 'android', 'all']
      profile:
        description: 'Build profile'
        required: true
        default: 'preview'
        type: choice
        options: ['development', 'preview', 'production']
      app:
        description: 'Which app'
        required: true
        default: 'buyer'
        type: choice
        options: ['buyer', 'supplier', 'both']

jobs:
  buyer:
    name: Build Buyer app
    runs-on: ubuntu-latest
    if: github.event.inputs.app != 'supplier'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Install
        working-directory: apps/buyer-mobile
        run: npm install
      - name: Build
        working-directory: apps/buyer-mobile
        run: eas build --profile ${{ github.event.inputs.profile || 'preview' }} --platform ${{ github.event.inputs.platform || 'all' }} --non-interactive --no-wait

  supplier:
    name: Build Supplier app
    runs-on: ubuntu-latest
    if: github.event.inputs.app != 'buyer'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Install
        working-directory: apps/supplier-mobile
        run: npm install
      - name: Build
        working-directory: apps/supplier-mobile
        run: eas build --profile ${{ github.event.inputs.profile || 'preview' }} --platform ${{ github.event.inputs.platform || 'all' }} --non-interactive --no-wait
