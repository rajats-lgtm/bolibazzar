name: Mobile EAS Build

on:
  push:
    branches: [main]
    paths:
      - 'apps/buyer-mobile/**'
      - 'apps/supplier-mobile/**'
      - '.github/workflows/mobile.yml'
  pull_request:
    paths:
      - 'apps/buyer-mobile/**'
      - 'apps/supplier-mobile/**'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'all'
        type: choice
        options: ['ios', 'android', 'all']
      profile:
        description: 'Build profile'
        required: true
        default: 'preview'
        type: choice
        options: ['development', 'preview', 'production']
      app:
        description: 'Which app'
        required: true
        default: 'both'
        type: choice
        options: ['buyer', 'supplier', 'both']

jobs:
  # Typecheck and bundle both apps. This runs with no secrets, so pull
  # requests and forks still get real feedback on whether the apps compile.
  verify:
    name: Verify (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [buyer-mobile, supplier-mobile]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - name: Install
        working-directory: apps/${{ matrix.app }}
        run: npm ci
      - name: Typecheck
        working-directory: apps/${{ matrix.app }}
        run: npx tsc --noEmit
      - name: Bundle for iOS and Android
        working-directory: apps/${{ matrix.app }}
        run: |
          for platform in ios android; do
            echo "::group::Bundling $platform"
            npx expo export --platform "$platform" --output-dir "/tmp/export-$platform"
            echo "::endgroup::"
          done

  # Work out which apps to build, and whether we can build at all.
  plan:
    name: Plan builds
    runs-on: ubuntu-latest
    needs: verify
    outputs:
      apps: ${{ steps.plan.outputs.apps }}
      has_token: ${{ steps.plan.outputs.has_token }}
    steps:
      - id: plan
        env:
          # Secrets cannot be read from a job-level `if`, so resolve it here.
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CHOICE: ${{ github.event.inputs.app }}
        run: |
          case "${CHOICE:-both}" in
            buyer)    apps='["buyer-mobile"]' ;;
            supplier) apps='["supplier-mobile"]' ;;
            *)        apps='["buyer-mobile","supplier-mobile"]' ;;
          esac
          echo "apps=$apps" >> "$GITHUB_OUTPUT"
          if [ -n "$EXPO_TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=EAS build skipped::EXPO_TOKEN is not set, so no cloud build was queued. Add it under Settings → Secrets and variables → Actions."
          fi

  build:
    name: EAS build (${{ matrix.app }})
    runs-on: ubuntu-latest
    needs: plan
    # Only build on an explicit dispatch or a push to main, and only when a
    # token exists — otherwise every push fails on a missing secret.
    if: needs.plan.outputs.has_token == 'true' && github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.plan.outputs.apps) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - name: Setup EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          # Without this the action shells out to yarn, which is not the
          # package manager these apps use and fails on the runner.
          packager: npm
      - name: Install
        working-directory: apps/${{ matrix.app }}
        run: npm ci
      - name: Build
        working-directory: apps/${{ matrix.app }}
        run: |
          eas build \
            --profile "${{ github.event.inputs.profile || 'preview' }}" \
            --platform "${{ github.event.inputs.platform || 'all' }}" \
            --non-interactive \
            --no-wait
